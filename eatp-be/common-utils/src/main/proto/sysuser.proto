syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.eatp.grpc.usermgt.proto";
option java_outer_classname = "SysUserProto";

message SysUserProtoRequest {
  string user_name = 1;
  string password = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  string phone_no = 6;
  int32 role_no = 7;
  string avatar_url = 8;
  string sub = 9;
  bool active = 10;
  bool deletable = 11;
  int32 locked_times = 12;
}

message SysUserProtoResponse {
  string user_name = 1;
  string email = 2;
  int32 role_no = 3;
  bool created = 4;
}

service SysUserProtoService {
  rpc createSysUserProto (SysUserProtoRequest) returns (SysUserProtoResponse);
}